name: sweetmtl-bridge

# The C ABI over metal2vulkan's runtime that SweetMTLDevice (backboardd on the phone) links, and
# the driver bundle that links it: both are built for the device here, so a change that only
# compiles on the host still fails the build.
on:
  workflow_dispatch:
  push:
    branches: [main, fajita-gpu]
    paths:
      - "tools/sweetmtl/**"
      # …but not the prose: a README/NOTES edit under tools/sweetmtl/ does not need a bridge build.
      - "!tools/sweetmtl/*.md"
      - "!tools/sweetmtl/**/*.md"
      - ".github/workflows/sweetmtl-bridge.yml"
  pull_request:
    paths:
      - "tools/sweetmtl/**"
      - "!tools/sweetmtl/*.md"
      - "!tools/sweetmtl/**/*.md"

concurrency:
  group: sweetmtl-bridge-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ios:
    runs-on: macos-14
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tools/sweetmtl/bridge
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup --version || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          . "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios
          rustc --version
          cargo --version

      - name: Build for the device
        run: |
          . "$HOME/.cargo/env"
          cargo build --release --target aarch64-apple-ios

      - name: Header is regenerated from the sources
        run: |
          . "$HOME/.cargo/env"
          cargo install cbindgen --version 0.29.4 --locked
          sh ./generate-header.sh
          git diff --exit-code -- include/sweetmtl_bridge.h || {
            echo "include/sweetmtl_bridge.h has drifted: commit the output of generate-header.sh" >&2
            exit 1
          }

      - name: Stage
        run: |
          mkdir -p out
          cp target/aarch64-apple-ios/release/libsweetmtl_bridge.a out/
          cp target/aarch64-apple-ios/release/libsweetmtl_bridge.dylib out/
          cp include/sweetmtl_bridge.h out/
          (cd out && shasum -a 256 * > SHA256SUMS)
          file out/*.a out/*.dylib
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: sweetmtl-bridge-ios
          path: tools/sweetmtl/bridge/out/
          if-no-files-found: error

  # SweetMTLDriver.bundle and its test tool, built from the `ios` job's bridge artifact: the ObjC
  # layer, its link against the bridge, and the tool's own compile are what the phone would run, so
  # they are checked here rather than first on the device. build.sh is the same script a developer
  # runs locally (`./build.sh`, SWEETMTL_BRIDGE_ARTIFACT naming the artifact).
  driver:
    needs: ios
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tools/sweetmtl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sweetmtl-bridge-ios
          path: tools/sweetmtl/bridge/out/

      - name: The driver and its test tool
        env:
          SWEETMTL_BRIDGE_ARTIFACT: ${{ github.workspace }}/tools/sweetmtl/bridge/out
        run: sh build.sh

      - name: Stage
        run: |
          # The metallibs are built only where the runner's Xcode has the Metal compiler (Xcode 16.3+
          # needs `xcodebuild -downloadComponent MetalToolchain`); build.sh says so and carries on.
          cd out
          for f in metal_compute metal_render scale_and_offset.metallib triangle.metallib; do
            [ -f "$f" ] && shasum -a 256 "$f" >> SHA256SUMS
          done
          shasum -a 256 SweetMTLDriver.bundle/SweetMTLDriver >> SHA256SUMS
          file SweetMTLDriver.bundle/SweetMTLDriver metal_compute metal_render
          ls -la
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: sweetmtl-driver-ios
          path: tools/sweetmtl/out/
          if-no-files-found: error

  # The bridge's C test, where it is written to pass: the system Lavapipe by path, with no Vulkan
  # loader. (On a Mac the same test gets through the whole ABI and then dies inside Lavapipe's own
  # LLVM JIT for the shader the runtime dispatches; see tools/sweetmtl/README.md.)
  lavapipe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tools/sweetmtl/bridge
    steps:
      - uses: actions/checkout@v4

      - name: Lavapipe, and LLVM 21 for the fixture
        # The fixture needs LLVM 20+ (`captures(none)`); noble's own LLVM 18 and trixie's 19 cannot
        # assemble it. Noble's `mesa-vulkan-drivers` carries the Lavapipe ICD the test is run with.
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          sudo sh -c 'echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" > /etc/apt/sources.list.d/llvm.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-21 mesa-vulkan-drivers
          /usr/lib/llvm-21/bin/llvm-as --version | head -1
          ls -l /usr/lib/x86_64-linux-gnu/libvulkan_lvp.so

      - name: Toolchain
        run: |
          rustc --version
          cargo --version

      - name: The C ABI test, against the system ICD
        env:
          METAL2VULKAN_LLVM_AS: /usr/lib/llvm-21/bin/llvm-as
        run: sh tests/run.sh /usr/lib/x86_64-linux-gnu/libvulkan_lvp.so
